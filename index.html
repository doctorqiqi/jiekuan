<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>借还款与利息管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }

        body {
            padding-top: var(--sat);
            padding-bottom: calc(var(--sab) + 1.5rem);
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Fluid Glass 顶流液态玻璃质感 */
        .glass-card {
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), inset 0 1px 1px 0 rgba(255, 255, 255, 0.8);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.5);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15), 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        /* 弥散光晕背景 */
        .ambient-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: #f1f5f9;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: meshMove 20s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }
        .orb-1 { top: -15%; left: -10%; width: 65vw; height: 65vw; background: radial-gradient(circle, #c7d2fe 0%, #e0e7ff 100%); }
        .orb-2 { bottom: -15%; right: -10%; width: 70vw; height: 70vw; background: radial-gradient(circle, #ddd6fe 0%, #fae8ff 100%); animation-delay: -7s; }
        .orb-3 { top: 35%; left: 25%; width: 45vw; height: 45vw; background: radial-gradient(circle, #bae6fd 0%, #e0f2fe 100%); animation-delay: -14s; }

        @keyframes meshMove {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -50px) scale(1.1); }
            100% { transform: translate(-30px, 30px) scale(0.95); }
        }

        .spring-act {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .spring-act:active {
            transform: scale(0.95);
        }

        /* 移动端 Apple 风格卡片自适应 */
        @media (max-width: 768px) {
            .responsive-table thead { display: none; }
            .responsive-table, .responsive-table tbody, .responsive-table tr, .responsive-table td {
                display: block;
                width: 100%;
            }
            .responsive-table tr {
                background: rgba(255, 255, 255, 0.72);
                backdrop-filter: blur(20px) saturate(190%);
                -webkit-backdrop-filter: blur(20px) saturate(190%);
                margin-bottom: 1rem;
                border: 1px solid rgba(255, 255, 255, 0.7);
                border-radius: 1.5rem;
                box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
                padding: 1.25rem;
            }
            .responsive-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.6rem 0;
                border-bottom: 1px dashed rgba(203, 213, 225, 0.5);
                text-align: right;
                font-size: 0.875rem;
            }
            .responsive-table td:last-child {
                border-bottom: none;
                padding-top: 0.9rem;
                justify-content: flex-end;
                gap: 0.6rem;
            }
            .responsive-table td::before {
                content: attr(data-label);
                font-weight: 500;
                color: #64748b;
                font-size: 0.8rem;
                text-align: left;
            }
        }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
    <!-- 背景流体光影 -->
    <div class="ambient-mesh">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <!-- 顶栏 Navigation -->
    <header class="glass-card sticky top-0 z-40 border-b border-white/40">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 text-white flex items-center justify-center font-black text-base shadow-lg shadow-indigo-500/30 spring-act">
                    贷
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-black text-slate-900 tracking-tight leading-none">借还款与利息</h1>
                    <p class="text-[10px] text-indigo-600 font-bold tracking-widest mt-0.5 uppercase">Pro Studio Edition</p>
                </div>
            </div>
            <div class="flex space-x-2">
                <button onclick="exportData()" class="glass-card hover:bg-white/90 text-slate-700 text-xs px-3.5 py-2.5 rounded-xl flex items-center gap-1.5 transition font-semibold spring-act">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    备份
                </button>
                <button onclick="document.getElementById('importFile').click()" class="glass-card hover:bg-white/90 text-slate-700 text-xs px-3.5 py-2.5 rounded-xl flex items-center gap-1.5 transition font-semibold spring-act">
                    <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    恢复
                </button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-5">
        <!-- 仪表盘概览卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3.5">
            <div class="md:col-span-4 glass-card p-5 rounded-3xl flex items-center justify-between relative overflow-hidden">
                <div class="space-y-1 z-10">
                    <p class="text-xs text-slate-500 font-semibold tracking-wide">总体清偿率</p>
                    <div class="flex items-baseline space-x-1">
                        <span id="overallPercent" class="text-3xl font-black text-slate-900 tabular-nums">0</span>
                        <span class="text-lg font-bold text-indigo-600">%</span>
                    </div>
                    <p class="text-[11px] text-slate-400 font-medium">已还与待还实时比例</p>
                </div>
                <div class="relative w-20 h-20 flex items-center justify-center">
                    <svg class="w-20 h-20 transform -rotate-90">
                        <circle cx="40" cy="40" r="32" stroke="currentColor" stroke-width="8" class="text-slate-200/60" fill="transparent"/>
                        <circle id="progressCircle" cx="40" cy="40" r="32" stroke="currentColor" stroke-width="8" class="text-indigo-600 transition-all duration-700 ease-out" fill="transparent" stroke-dasharray="201" stroke-dashoffset="201" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <div class="md:col-span-8 grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="glass-card p-4 rounded-2xl flex flex-col justify-between spring-act">
                    <p class="text-xs text-slate-500 font-semibold">总本金金额</p>
                    <h3 id="statTotalPrincipal" class="text-base md:text-xl font-black text-slate-900 mt-2 tracking-tight tabular-nums">￥0.00</h3>
                </div>
                <div class="glass-card p-4 rounded-2xl flex flex-col justify-between spring-act">
                    <p class="text-xs text-rose-600 font-semibold">待还 / 待收本金</p>
                    <h3 id="statRemainingPrincipal" class="text-base md:text-xl font-black text-rose-500 mt-2 tracking-tight tabular-nums">￥0.00</h3>
                </div>
                <div class="glass-card p-4 rounded-2xl flex flex-col justify-between spring-act">
                    <p class="text-xs text-emerald-600 font-semibold">已还 / 已收本金</p>
                    <h3 id="statPaidPrincipal" class="text-base md:text-xl font-black text-emerald-600 mt-2 tracking-tight tabular-nums">￥0.00</h3>
                </div>
                <div class="glass-card p-4 rounded-2xl flex flex-col justify-between spring-act">
                    <p class="text-xs text-amber-600 font-semibold">累计支付利息</p>
                    <h3 id="statPaidInterest" class="text-base md:text-xl font-black text-amber-500 mt-2 tracking-tight tabular-nums">￥0.00</h3>
                </div>
            </div>
        </div>

        <!-- 操控与多维筛选栏 (支持项目/备注搜索) -->
        <div class="glass-card p-3.5 rounded-3xl flex flex-col md:flex-row justify-between gap-3 items-center">
            <button onclick="openModal()" class="w-full md:w-auto bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 text-white font-bold px-6 py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/25 spring-act">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                新增记录
            </button>
            <div class="flex flex-wrap md:flex-nowrap gap-2.5 w-full md:w-auto">
                <!-- 备注/项目关键词搜索框 -->
                <div class="relative flex-1 md:w-48">
                    <input type="text" id="searchKeyword" oninput="render()" placeholder="🔍 搜索项目/备注..." class="glass-input w-full text-xs md:text-sm px-3.5 py-3 rounded-2xl text-slate-800 font-semibold outline-none">
                </div>
                <select id="filterDirection" onchange="render()" class="glass-input flex-1 md:flex-none text-xs md:text-sm px-3 py-3 rounded-2xl text-slate-800 font-semibold outline-none cursor-pointer">
                    <option value="ALL">全部类型</option>
                    <option value="BORROW">我借入的</option>
                    <option value="LEND">我借出的</option>
                </select>
                <select id="filterPlatform" onchange="render()" class="glass-input flex-1 md:flex-none text-xs md:text-sm px-3.5 py-3 rounded-2xl text-slate-800 font-semibold outline-none cursor-pointer">
                    <option value="ALL">全部平台渠道</option>
                    <option value="支付宝-借呗">支付宝-借呗</option>
                    <option value="支付宝-花呗">支付宝-花呗</option>
                    <option value="微粒贷">微粒贷</option>
                    <option value="京东金条">京东金条</option>
                    <option value="银行贷款">银行贷款</option>
                    <option value="个人借款/借出">个人借款/借出</option>
                    <option value="其他">其他</option>
                </select>
                <select id="filterStatus" onchange="render()" class="glass-input flex-1 md:flex-none text-xs md:text-sm px-3 py-3 rounded-2xl text-slate-800 font-semibold outline-none cursor-pointer">
                    <option value="ALL">全部状态</option>
                    <option value="未还清">进行中</option>
                    <option value="已还清">已结清</option>
                </select>
            </div>
        </div>

        <!-- 明细列表/卡片展示 -->
        <div class="bg-transparent md:glass-card md:rounded-3xl overflow-hidden">
            <table class="w-full text-left text-sm text-slate-600 responsive-table">
                <thead class="bg-white/40 backdrop-blur-md text-slate-400 font-bold border-b border-white/50 text-[11px] uppercase tracking-wider">
                    <tr>
                        <th class="p-4">类型</th>
                        <th class="p-4">项目 / 平台</th>
                        <th class="p-4">发生日期</th>
                        <th class="p-4">还款/收款日</th>
                        <th class="p-4">总本金</th>
                        <th class="p-4">已还/已收本金</th>
                        <th class="p-4">利息</th>
                        <th class="p-4">进度</th>
                        <th class="p-4">到期日</th>
                        <th class="p-4">状态</th>
                        <th class="p-4 text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="loanList" class="md:divide-y md:divide-slate-200/50">
                    <!-- 动态渲染 -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- iOS 抽屉式弹窗 Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-md hidden flex items-end md:items-center justify-center p-0 md:p-4 z-50 transition-all duration-300">
        <div class="glass-card bg-white/92 rounded-t-[2.5rem] md:rounded-3xl shadow-2xl w-full max-w-lg p-6 space-y-4 max-h-[92vh] overflow-y-auto pb-10 md:pb-6 border-t border-white">
            <div class="w-12 h-1.5 bg-slate-300/80 rounded-full mx-auto md:hidden -mt-1 mb-2"></div>
            <div class="flex justify-between items-center border-b border-slate-200/60 pb-3.5">
                <h3 id="modalTitle" class="text-base font-black text-slate-900 tracking-tight">新增记录</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200/60 flex items-center justify-center text-slate-500 hover:bg-slate-300/60 transition spring-act"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <form id="loanForm" onsubmit="saveLoan(event)" class="space-y-4">
                <input type="hidden" id="loanId">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">记录类型</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="direction" value="BORROW" checked class="peer hidden" onchange="toggleDirectionUI()">
                            <div class="py-3 text-center rounded-2xl border border-slate-200 text-xs font-bold text-slate-600 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition spring-act">
                                📥 我借入的 (负债)
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="direction" value="LEND" class="peer hidden" onchange="toggleDirectionUI()">
                            <div class="py-3 text-center rounded-2xl border border-slate-200 text-xs font-bold text-slate-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 transition spring-act">
                                📤 我借出的 (资产)
                            </div>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">渠道 / 平台</label>
                    <select id="platform" required class="glass-input w-full rounded-2xl px-4 py-3.5 text-sm font-semibold text-slate-800">
                        <option value="支付宝-借呗">支付宝-借呗</option>
                        <option value="支付宝-花呗">支付宝-花呗</option>
                        <option value="微粒贷">微粒贷</option>
                        <option value="京东金条">京东金条</option>
                        <option value="银行贷款">银行贷款</option>
                        <option value="个人借款/借出">个人借款/借出</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">说明 / 备注 / 借款人</label>
                    <input type="text" id="title" required placeholder="如：借给张三、周转资金" class="glass-input w-full rounded-2xl px-4 py-3.5 text-sm font-semibold text-slate-800">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5">借出/借入日期</label>
                        <input type="date" id="loanDate" required class="glass-input w-full rounded-2xl px-3.5 py-3.5 text-sm font-semibold text-slate-800">
                    </div>
                    <div>
                        <label id="lblRepayDate" class="block text-xs font-bold text-indigo-600 mb-1.5">最近还款/收款日</label>
                        <input type="date" id="repayDate" class="glass-input w-full rounded-2xl px-3.5 py-3.5 text-sm font-semibold text-slate-800">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">到期日期</label>
                    <input type="date" id="dueDate" class="glass-input w-full rounded-2xl px-4 py-3.5 text-sm font-semibold text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5">总本金 (元)</label>
                    <input type="number" step="0.01" id="principal" required min="0" placeholder="0.00" class="glass-input w-full rounded-2xl px-4 py-3.5 text-base font-black text-slate-900 tabular-nums">
                </div>
                <div class="grid grid-cols-2 gap-3 bg-white/40 p-4 rounded-2xl border border-white/60 shadow-inner">
                    <div>
                        <label id="lblPaidP" class="block text-xs font-bold text-slate-500 mb-1.5">已还/已收本金 (元)</label>
                        <input type="number" step="0.01" id="paidPrincipal" value="0" min="0" class="glass-input w-full rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 tabular-nums">
                    </div>
                    <div>
                        <label id="lblPaidI" class="block text-xs font-bold text-slate-500 mb-1.5">利息 (元)</label>
                        <input type="number" step="0.01" id="paidInterest" value="0" min="0" class="glass-input w-full rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 tabular-nums">
                    </div>
                </div>
                <div class="flex space-x-3 pt-3 border-t border-slate-200/50">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3.5 rounded-2xl text-sm font-bold text-slate-600 bg-slate-200/60 hover:bg-slate-300/60 transition spring-act">取消</button>
                    <button type="submit" class="flex-1 py-3.5 rounded-2xl text-sm font-bold bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-500/30 transition spring-act">保存记录</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let loans = JSON.parse(localStorage.getItem('my_loans_v5') || '[]');

        function saveToStorage() {
            localStorage.setItem('my_loans_v5', JSON.stringify(loans));
        }

        function formatMoney(num) {
            return '￥' + Number(num || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function toggleDirectionUI() {
            const dir = document.querySelector('input[name="direction"]:checked').value;
            const isLend = dir === 'LEND';
            document.getElementById('lblRepayDate').innerText = isLend ? '最近收款/还款日' : '最近还款/划扣日';
            document.getElementById('lblPaidP').innerText = isLend ? '已收本金 (元)' : '已还本金 (元)';
            document.getElementById('lblPaidI').innerText = isLend ? '已收利息 (元)' : '已付利息 (元)';
        }

        function render() {
            const list = document.getElementById('loanList');
            const keyword = (document.getElementById('searchKeyword').value || '').toLowerCase().trim();
            const dirFilter = document.getElementById('filterDirection').value;
            const platformFilter = document.getElementById('filterPlatform').value;
            const statusFilter = document.getElementById('filterStatus').value;

            let filtered = loans.filter(item => {
                const itemDir = item.direction || 'BORROW';
                const matchDir = dirFilter === 'ALL' || itemDir === dirFilter;
                const matchPlatform = platformFilter === 'ALL' || item.platform === platformFilter;
                
                // 备注/项目名称关键词模糊检索
                const titleText = (item.title || '').toLowerCase();
                const platformText = (item.platform || '').toLowerCase();
                const matchKeyword = !keyword || titleText.includes(keyword) || platformText.includes(keyword);

                const isFinished = item.paidPrincipal >= item.principal;
                const matchStatus = statusFilter === 'ALL' || 
                    (statusFilter === '已还清' && isFinished) || 
                    (statusFilter === '未还清' && !isFinished);

                return matchDir && matchPlatform && matchKeyword && matchStatus;
            });

            // 按借款日期倒序排列
            filtered.sort((a, b) => {
                const dateA = a.loanDate ? new Date(a.loanDate).getTime() : 0;
                const dateB = b.loanDate ? new Date(b.loanDate).getTime() : 0;
                return dateB - dateA;
            });

            // 汇总计算
            let totalP = 0, paidP = 0, paidI = 0;
            filtered.forEach(item => {
                totalP += Number(item.principal || 0);
                paidP += Number(item.paidPrincipal || 0);
                paidI += Number(item.paidInterest || 0);
            });

            const overallPct = totalP > 0 ? Math.min(100, Math.round((paidP / totalP) * 100)) : 0;
            document.getElementById('overallPercent').innerText = overallPct;
            
            const circle = document.getElementById('progressCircle');
            const circumference = 201;
            const offset = circumference - (overallPct / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            document.getElementById('statTotalPrincipal').innerText = formatMoney(totalP);
            document.getElementById('statPaidPrincipal').innerText = formatMoney(paidP);
            document.getElementById('statRemainingPrincipal').innerText = formatMoney(totalP - paidP);
            document.getElementById('statPaidInterest').innerText = formatMoney(paidI);

            list.innerHTML = '';
            if (filtered.length === 0) {
                list.innerHTML = `<tr><td colspan="11" class="text-center py-16 text-slate-400 glass-card rounded-3xl">没有找到符合条件的记录</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const percent = Math.min(100, Math.round((item.paidPrincipal / item.principal) * 100) || 0);
                const isFinished = item.paidPrincipal >= item.principal;
                const isLend = (item.direction === 'LEND');
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-white/40 transition md:table-row';
                
                tr.innerHTML = `
                    <td class="p-4" data-label="类型">
                        ${isLend 
                            ? '<span class="px-2.5 py-1 text-[11px] bg-emerald-500/10 text-emerald-600 border border-emerald-500/20 rounded-full font-black">📤 借出</span>' 
                            : '<span class="px-2.5 py-1 text-[11px] bg-indigo-500/10 text-indigo-600 border border-indigo-500/20 rounded-full font-black">📥 借入</span>'}
                    </td>
                    <td class="p-4" data-label="平台/项目">
                        <div>
                            <span class="inline-block px-2 py-0.5 text-[10px] rounded-lg bg-slate-100 text-slate-500 font-bold border border-slate-200/60 mb-1">${item.platform}</span>
                            <div class="font-black text-slate-900 tracking-tight">${item.title}</div>
                        </div>
                    </td>
                    <td class="p-4 text-xs text-slate-400 font-medium tabular-nums" data-label="发生日期">${item.loanDate || '-'}</td>
                    <td class="p-4 text-xs text-indigo-600 font-bold tabular-nums" data-label="还/收款日">${item.repayDate || '-'}</td>
                    <td class="p-4 font-black text-slate-900 tracking-tight tabular-nums" data-label="总本金">${formatMoney(item.principal)}</td>
                    <td class="p-4 text-emerald-600 font-bold tabular-nums" data-label="已还/收">${formatMoney(item.paidPrincipal)}</td>
                    <td class="p-4 text-amber-500 font-bold tabular-nums" data-label="利息">${formatMoney(item.paidInterest)}</td>
                    <td class="p-4 md:w-28" data-label="进度">
                        <div class="w-full md:w-24">
                            <div class="flex justify-between text-[11px] mb-1 text-slate-400 font-bold tabular-nums">
                                <span>${percent}%</span>
                            </div>
                            <div class="w-full bg-slate-200/60 rounded-full h-1.5 overflow-hidden">
                                <div class="bg-gradient-to-r from-indigo-500 to-violet-500 h-1.5 rounded-full transition-all duration-500 shadow-sm" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    </td>
                    <td class="p-4 text-xs text-slate-400 font-medium tabular-nums" data-label="到期日">${item.dueDate || '无'}</td>
                    <td class="p-4" data-label="当前状态">
                        ${isFinished 
                            ? '<span class="px-3 py-1 text-[11px] bg-emerald-500/10 text-emerald-600 border border-emerald-500/20 rounded-full font-extrabold">已结清</span>' 
                            : '<span class="px-3 py-1 text-[11px] bg-rose-500/10 text-rose-500 border border-rose-500/20 rounded-full font-extrabold">进行中</span>'}
                    </td>
                    <td class="p-4 text-center space-x-2">
                        <button onclick="editLoan('${item.id}')" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold bg-indigo-50/80 px-3 py-1.5 rounded-xl transition spring-act border border-indigo-100/50">编辑</button>
                        <button onclick="deleteLoan('${item.id}')" class="text-slate-400 hover:text-rose-500 text-xs font-bold bg-slate-100/60 px-2.5 py-1.5 rounded-xl transition spring-act">删除</button>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        function openModal(editItem = null) {
            document.getElementById('modal').classList.remove('hidden');
            const today = new Date().toISOString().slice(0, 10);
            if (editItem) {
                document.getElementById('modalTitle').innerText = '更新明细';
                document.getElementById('loanId').value = editItem.id;
                
                const dir = editItem.direction || 'BORROW';
                document.querySelector(`input[name="direction"][value="${dir}"]`).checked = true;
                toggleDirectionUI();

                document.getElementById('platform').value = editItem.platform;
                document.getElementById('title').value = editItem.title;
                document.getElementById('loanDate').value = editItem.loanDate || today;
                document.getElementById('repayDate').value = editItem.repayDate || '';
                document.getElementById('principal').value = editItem.principal;
                document.getElementById('paidPrincipal').value = editItem.paidPrincipal;
                document.getElementById('paidInterest').value = editItem.paidInterest;
                document.getElementById('dueDate').value = editItem.dueDate || '';
            } else {
                document.getElementById('modalTitle').innerText = '新增记录';
                document.getElementById('loanForm').reset();
                document.getElementById('loanId').value = '';
                document.querySelector('input[name="direction"][value="BORROW"]').checked = true;
                toggleDirectionUI();
                document.getElementById('loanDate').value = today;
                document.getElementById('repayDate').value = '';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveLoan(e) {
            e.preventDefault();
            const id = document.getElementById('loanId').value;
            const dir = document.querySelector('input[name="direction"]:checked').value;
            
            const data = {
                id: id || Date.now().toString(),
                direction: dir,
                platform: document.getElementById('platform').value,
                title: document.getElementById('title').value,
                loanDate: document.getElementById('loanDate').value,
                repayDate: document.getElementById('repayDate').value,
                principal: parseFloat(document.getElementById('principal').value) || 0,
                paidPrincipal: parseFloat(document.getElementById('paidPrincipal').value) || 0,
                paidInterest: parseFloat(document.getElementById('paidInterest').value) || 0,
                dueDate: document.getElementById('dueDate').value
            };

            if (id) {
                const idx = loans.findIndex(l => l.id === id);
                if (idx !== -1) loans[idx] = data;
            } else {
                loans.unshift(data);
            }

            saveToStorage();
            render();
            closeModal();
        }

        function editLoan(id) {
            const item = loans.find(l => l.id === id);
            if (item) openModal(item);
        }

        function deleteLoan(id) {
            if (confirm('确定要彻底删除该笔记录吗？')) {
                loans = loans.filter(l => l.id !== id);
                saveToStorage();
                render();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(loans, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `借贷明细备份_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    loans = JSON.parse(event.target.result);
                    saveToStorage();
                    render();
                    alert('数据恢复成功！');
                } catch(err) {
                    alert('导入失败，请选择有效的 JSON 备份文件。');
                }
            };
            reader.readAsText(file);
        }

        render();
    </script>
</body>
</html>
